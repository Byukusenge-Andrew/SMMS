name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_DB: social_media_db_test

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}


    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety==2.3.5 bandit

    - name: Check dependencies for security vulnerabilities
      run: |
        cd backend
        pip install -r requirements.txt
        safety check || true

    - name: Run security linting with bandit
      run: |
        cd backend
        bandit -r . -x tests/ -c .bandit.yaml -f json -o bandit-report.json || true
        bandit -r . -x tests/ -c .bandit.yaml

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [security] # removed 'test' from needs
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Create logs directory
      run: mkdir -p backend/logs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt

    - name: Install Pillow
      run: pip install Pillow

    - name: Collect static files
      run: |
        cd backend
        echo "SECRET_KEY=test-secret-key" > .env
        echo "DEBUG=False" >> .env
        echo "DATABASE_URL=sqlite:///test.db" >> .env
        python manage.py collectstatic --noinput

    - name: Check Django deployment
      run: |
        cd backend
        python manage.py check --deploy

  notify:
    name: CI Results
    runs-on: ubuntu-latest
    needs: [security, build] # removed 'test'
    if: always()
    steps:
    - name: CI Success
      if: ${{ needs.security.result == 'success' && needs.build.result == 'success' }}
      run: echo "✅ All CI checks passed successfully!"
    - name: CI Failure
      if: ${{ needs.security.result == 'failure' || needs.build.result == 'failure' }}
      run: echo "❌ CI pipeline failed. Check the logs for details."
