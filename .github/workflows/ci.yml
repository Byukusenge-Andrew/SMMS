name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_DB: social_media_db_test

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install coverage pytest-django pytest-cov flake8 black isort

    - name: Install Pillow (ignore errors on Python 3.13)
      run: |
        cd backend
        pip install Pillow==10.1.0 || true

    - name: Set up environment variables
      run: |
        cd backend
        echo "SECRET_KEY=test-secret-key-for-ci" > .env
        echo "DEBUG=True" >> .env
        echo "DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "EMAIL_HOST_USER=test@example.com" >> .env
        echo "EMAIL_HOST_PASSWORD=test-password" >> .env
        echo "FRONTEND_URL=http://localhost:3000" >> .env

    - name: Create logs directory
      run: mkdir -p backend/logs

    - name: Run database migrations
      run: |
        cd backend
        python manage.py migrate

    - name: Run code formatting check (Black)
      run: |
        cd backend
        black --check --diff .

    - name: Run import sorting check (isort)
      run: |
        cd backend
        isort --check-only --diff .

    - name: Run linting (flake8)
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Django tests with coverage
      run: |
        cd backend
        coverage run --source='.' manage.py test
        coverage report --show-missing
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}


    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety==2.3.5 bandit

    - name: Check dependencies for security vulnerabilities
      run: |
        cd backend
        pip install -r requirements.txt
        safety check || true

    - name: Run security linting with bandit
      run: |
        cd backend
        bandit -r . -x tests/ -c ../../.bandit.yaml -f json -o bandit-report.json || true
        bandit -r . -x tests/ -c ../../.bandit.yaml

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt

    - name: Collect static files
      run: |
        cd backend
        echo "SECRET_KEY=test-secret-key" > .env
        echo "DEBUG=False" >> .env
        echo "DATABASE_URL=sqlite:///test.db" >> .env
        python manage.py collectstatic --noinput

    - name: Check Django deployment
      run: |
        cd backend
        python manage.py check --deploy

  notify:
    name: CI Results
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: always()
    
    steps:
    - name: CI Success
      if: ${{ needs.test.result == 'success' && needs.security.result == 'success' && needs.build.result == 'success' }}
      run: echo "✅ All CI checks passed successfully!"
      
    - name: CI Failure
      if: ${{ needs.test.result == 'failure' || needs.security.result == 'failure' || needs.build.result == 'failure' }}
      run: echo "❌ CI pipeline failed. Check the logs for details."
