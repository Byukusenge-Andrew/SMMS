<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Match Center</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Navigation */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent-color);
        }

        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Main Workspace Content */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Video Player Wrapper */
        .video-container {
            flex: 3;
            background-color: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Aspect ratio container for fluid scaling */
        .video-ratio-box {
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe, video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Sidebar Panels */
        .sidebar {
            flex: 1;
            background-color: var(--card-bg);
            border-left: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            min-width: 320px;
            max-width: 400px;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #1f2937;
            background-color: #151e2e;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            background-color: var(--card-bg);
        }

        .sidebar-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .match-info-card {
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .match-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .match-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Responsive Layout fixes */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .video-container {
                flex: none;
                height: 56.25vw; /* 16:9 ratio on mobile screens */
            }
            .sidebar {
                max-width: 100%;
                border-left: none;
                border-top: 1px solid #1f2937;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MATCH<span>CENTER</span></div>
        <div class="live-badge">Live</div>
    </header>

    <div class="container">
        <!-- Video Stream Player Panel -->
        <div class="video-container">
            <div class="video-ratio-box">
                <!-- Replace the src URL below with your actual match stream link, IPTV embed URL, or local file -->
                <iframe 
                    src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID_HERE" 
                    allowfullscreen
                    allow="autoplay; encrypted-media">
                </iframe>
            </div>
        </div>

        <!-- Dashboard / Stats Sidebar -->
        <div class="sidebar">
            <div class="sidebar-tabs">
                <div class="tab active">Match Details</div>
                <div class="tab">Stats & Feed</div>
            </div>
            
            <div class="sidebar-content">
                <div class="match-info-card">
                    <div class="match-title">Live Match Broadcast</div>
                    <div class="match-meta">Status: Operational • Ultra HD Feed</div>
                </div>
                
                <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5;">
                    To bind your specific match stream link, open this `.html` file inside a code/text editor and update the <code>&lt;iframe&gt;</code> <code>src</code> attribute with your streaming provider's target URL.
                </p>
            </div>
        </div>
    </div>

</body>
</html>
