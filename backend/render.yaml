services:
  - type: web
    name: smms-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn social_media_manager.asgi:application -k uvicorn.workers.UvicornWorker'
    healthCheckPath: /api/health/
    envVars:
      # Django Core Settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      
      # AWS RDS Database (your existing database)
      - key: DATABASE_URL
        value: "postgres://postgres:andre01ab.@social-media-db.chgyuqs4suf5.eu-north-1.rds.amazonaws.com:5432/postgres?sslmode=require"
      
      # Redis Configuration (using Render Redis service)
      - key: REDIS_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: smms-redis
          property: connectionString
      
      # Django Admin Superuser
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "andrebyukusenge9@gmail.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      
      # Application Settings (update with your frontend URL)
      - key: FRONTEND_URL
        value: "https://your-frontend.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      
      # Web Concurrency
      - key: WEB_CONCURRENCY
        value: "4"
      
      # NOTE: Add the following environment variables manually in Render Dashboard
      # for security reasons (don't put sensitive data in render.yaml):
      # 
      # EMAIL_HOST=smtp.gmail.com
      # EMAIL_PORT=587
      # EMAIL_USE_TLS=True
      # EMAIL_HOST_USER=your-email@gmail.com
      # EMAIL_HOST_PASSWORD=your-app-password
      # DEFAULT_FROM_EMAIL=your-email@gmail.com
      # 
      # SUPABASE_URL=https://your-project.supabase.co
      # SUPABASE_KEY=your-supabase-key
      # SUPABASE_BUCKET=keativpictures
      # 
      # All your API keys (Twitter, TikTok, Reddit, Slack, etc.)
      # Social auth keys (Google, GitHub)
      # Any other sensitive configuration

# Redis service for Celery
databases:
  - name: smms-redis
    plan: starter
