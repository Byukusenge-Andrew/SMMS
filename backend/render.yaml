services:
  - type: web
    name: smms-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn social_media_manager.asgi:application -k uvicorn.workers.UvicornWorker'
    healthCheckPath: /api/health/
    envVars:
      # Django Core Settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      
      # AWS RDS Database (your existing database)
      - key: DATABASE_URL
        value: "postgres://postgres:andre01ab.@social-media-db.chgyuqs4suf5.eu-north-1.rds.amazonaws.com:5432/postgres?sslmode=require"
      
      # Redis Configuration (using Render Redis service)
      - key: REDIS_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: smms-redis
          property: connectionString
      
      # Django Admin Superuser
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "andrebyukusenge9@gmail.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      
      # Application Settings (update with your frontend URL)
      - key: FRONTEND_URL
        value: "https://your-frontend.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      
      # Web Concurrency
      - key: WEB_CONCURRENCY
        value: "4"

  # Celery Worker Service (for background tasks)
  - type: worker
    name: smms-celery-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: './build.sh'
    startCommand: 'celery -A social_media_manager worker --loglevel=info'
    envVars:
      # Django Core Settings (shared with web service)
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      
      # AWS RDS Database (same as web service)
      - key: DATABASE_URL
        value: "postgres://postgres:andre01ab.@social-media-db.chgyuqs4suf5.eu-north-1.rds.amazonaws.com:5432/postgres?sslmode=require"
      
      # Redis Configuration (same as web service)
      - key: REDIS_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: smms-redis
          property: connectionString

  # Celery Beat Service (for scheduled tasks)
  - type: worker
    name: smms-celery-beat
    runtime: python
    region: oregon
    plan: starter
    buildCommand: './build.sh'
    startCommand: 'celery -A social_media_manager beat --loglevel=info'
    envVars:
      # Django Core Settings (shared with web service)
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      
      # AWS RDS Database (same as web service)
      - key: DATABASE_URL
        value: "postgres://postgres:andre01ab.@social-media-db.chgyuqs4suf5.eu-north-1.rds.amazonaws.com:5432/postgres?sslmode=require"
      
      # Redis Configuration (same as web service)
      - key: REDIS_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: smms-redis
          property: connectionString

# Redis service for Celery and caching
databases:
  - name: smms-redis
    plan: starter
    databaseName: smms-redis
    user: default

