services:
  - type: web
    name: smms-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn social_media_manager.asgi:application -k uvicorn.workers.UvicornWorker'
    healthCheckPath: /api/health/
    envVars:
      # Django Core Settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      
      # Database Configuration - SET IN RENDER DASHBOARD
      - key: DATABASE_URL
        sync: false
      
      # Redis Configuration (using Render Redis service)
      - key: REDIS_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: smms-redis
          property: connectionString
      
      # Django Admin Superuser
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      
      # Application Settings (update with your frontend URL)
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      
      # Web Concurrency
      - key: WEB_CONCURRENCY
        value: "4"

  # Celery Worker Service (for background tasks)
  - type: worker
    name: smms-celery-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: './build.sh'
    startCommand: 'celery -A social_media_manager worker --loglevel=info --pool=solo'
    envVars:
      # Django Core Settings (shared with web service)
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      
      # Database Configuration - SET IN RENDER DASHBOARD  
      - key: DATABASE_URL
        sync: false
      
      # Redis Configuration (same as web service)
      - key: REDIS_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: smms-redis
          property: connectionString

  # Celery Beat Service (for scheduled tasks)
  - type: worker
    name: smms-celery-beat
    runtime: python
    region: oregon
    plan: starter
    buildCommand: './build.sh'
    startCommand: 'celery -A social_media_manager beat --loglevel=info'
    envVars:
      # Django Core Settings (shared with web service)
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      
      # Database Configuration - SET IN RENDER DASHBOARD
      - key: DATABASE_URL
        sync: false
      
      # Redis Configuration (same as web service)
      - key: REDIS_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: smms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: smms-redis
          property: connectionString

# Redis service for Celery and caching
databases:
  - name: smms-redis
    plan: starter
    databaseName: smms-redis
    user: default

# ===================================================================
# SECURITY NOTICE: ALL SECRETS MUST BE SET IN RENDER DASHBOARD
# ===================================================================
# 
# After deployment, manually add these environment variables 
# to ALL services (web, celery-worker, celery-beat) via Render Dashboard:
#
# CRITICAL - Database & Infrastructure:
# DATABASE_URL=your-postgres-connection-string
# DJANGO_SUPERUSER_EMAIL=your-email
# FRONTEND_URL=your-frontend-domain
# CORS_ALLOWED_ORIGINS=your-frontend-domain
#
# CRITICAL - Email Configuration:
# EMAIL_HOST_USER=your-email
# EMAIL_HOST_PASSWORD=your-app-password
#
# CRITICAL - Third Party Services:
# SUPABASE_URL=your-supabase-url
# SUPABASE_SERVICE_ROLE_KEY=your-supabase-key
# SUPABASE_BUCKET=your-bucket-name
#
# CRITICAL - Social Media API Keys:
# TWITTER_API_KEY=your-twitter-key
# TWITTER_API_KEY_SECRET=your-twitter-secret
# TWITTER_BEARER_TOKEN=your-bearer-token
# TWITTER_ACCESS_TOKEN=your-access-token
# TWITTER_ACCESS_TOKEN_SECRET=your-access-secret
# TWITTER_CLIENT_ID=your-twitter-client-id
# TWITTER_CLIENT_SECRET=your-twitter-client-secret
# TWITTER_REDIRECT_URI=https://your-domain.onrender.com/api/integrations/twitter/callback/
#
# LINKEDIN_CLIENT_ID=your-linkedin-id
# LINKEDIN_CLIENT_SECRET=your-linkedin-secret
# LINKEDIN_REDIRECT_URI=https://your-domain.onrender.com/api/integrations/linkedin/callback/
#
# TIKTOK_CLIENT_KEY=your-tiktok-key  
# TIKTOK_CLIENT_SECRET=your-tiktok-secret
#
# REDDIT_CLIENT_ID=your-reddit-id
# REDDIT_CLIENT_SECRET=your-reddit-secret
#
# CRITICAL - Slack Integration:
# SLACK_BOT_TOKEN=your-slack-bot-token
# SLACK_CLIENT_ID=your-slack-client-id
# SLACK_CLIENT_SECRET=your-slack-client-secret
# SLACK_SIGNING_SECRET=your-slack-signing-secret
# SLACK_VERIFICATION_TOKEN=your-slack-verification-token
# SLACK_WEBHOOK_URL=your-slack-webhook
#
# CRITICAL - Social Authentication:
# SOCIAL_AUTH_GOOGLE_OAUTH2_KEY=your-google-oauth-key
# SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET=your-google-oauth-secret
# SOCIAL_AUTH_GITHUB_KEY=your-github-key
# SOCIAL_AUTH_GITHUB_SECRET=your-github-secret
#
# ===================================================================
