services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: smms_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-social-media-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - ./docker/postgres/backups:/backups
    networks:
      - smms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-social-media-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Uncomment to expose PostgreSQL port (not recommended for production)
    # ports:
    #   - "5432:5432"

  # Django Backend (Production)
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: smms_backend_prod
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/static
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      # Override database URL to use internal PostgreSQL
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-social-media-db}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        echo 'Starting Gunicorn server...' &&
        gunicorn social_media_manager.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    networks:
      - smms_network

  # Celery Worker
  celery-worker:
    build: .
    container_name: smms_celery_worker_prod
    volumes:
      - media_files:/app/media
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - postgres
    command: celery -A social_media_manager worker --loglevel=info --concurrency=2
    networks:
      - smms_network

  # Celery Beat (Scheduler)
  celery-beat:
    build: .
    container_name: smms_celery_beat_prod
    volumes:
      - media_files:/app/media
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - postgres
    command: celery -A social_media_manager beat --loglevel=info
    networks:
      - smms_network

  # Nginx (Optional - for production reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: smms_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf
      - static_files:/static
      - media_files:/media
    depends_on:
      - backend
    networks:
      - smms_network

networks:
  smms_network:
    driver: bridge

volumes:
  postgres_data:
  media_files:
  static_files:
